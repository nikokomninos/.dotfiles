set -s escape-time 0
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -g allow-passthrough on
unbind C-b
unbind f
set-option -g prefix C-SPACE
bind-key C-SPACE send-prefix
bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1
set -g mouse on

# Give every new session except "default" a ready-to-use workspace.
set-hook -g after-new-session 'if-shell -F "#{!=:#{session_name},default}" { rename-window -t ":1" nvim ; send-keys -t ":1" nvim Enter ; new-window -d -t ":2" -c "#{pane_current_path}" -n yazi yazi ; new-window -d -t ":3" -c "#{pane_current_path}" -n opencode opencode ; new-window -d -t ":4" -c "#{pane_current_path}" ; select-window -t ":1" }'

# set-option remain-on-exit on
set -g renumber-windows on   # renumber all windows when any window is closed
set -g escape-time 0         # zero-out escape time delay
set-window-option -g mode-keys vi

# style
set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'fg=color7 bg=default'
# set -g status-right ''
set -g status-right "#(uptime -p)"
set -g status-right-style 'fg=color8'
# set -g status-right ' #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD)'
set -g status-left '#S'
set -g status-left-style 'fg=color8'
set -g status-right-length 100
set -g status-left-length 100
setw -g window-status-current-style 'fg=colour6 bg=default bold'
setw -g window-status-current-format '#I:#W '
setw -g window-status-style 'fg=color8'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r f run-shell "tmux neww ~/.config/tmux/tmux-sessionizer.sh"

bind -r q if-shell -F '#{!=:#{session_name},default}' { run-shell "(tmux has-session -t '=default' 2>/dev/null || tmux new-session -d -s default) && tmux switch-client -c '#{client_name}' -t '=default' && tmux kill-session -t '#{session_id}'" }
bind -r Q if-shell -F '#{!=:#{session_name},default}' { run-shell "(tmux has-session -t '=default' 2>/dev/null || tmux new-session -d -s default) && tmux switch-client -c '#{client_name}' -t '=default' && tmux kill-session -t '#{session_id}'" }

#bind o display-popup -E "tms"
#bind f display-popup -E "tms switch"
